name: Feature request
description: Propose a scoped ChronoGraph capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which temporal knowledge or governed-memory problem needs solving?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, temporal semantics, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Evidence and security boundaries
      description: Explain provenance, sensitivity, auth, storage, and compatibility effects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
